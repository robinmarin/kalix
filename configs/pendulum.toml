[filter]
name = "pendulum"
description = "Simple pendulum with gravitational acceleration (EKF, trig dynamics)"

[state]
variables = ["theta", "omega"]

[dynamics]
theta = "theta + omega*dt"
omega = "omega - 9.81*sin(theta)*dt"

[observation]
variables   = ["z"]
expressions = ["theta"]

[noise]
process     = [[0.001, 0], [0, 0.001]]
measurement = [[0.1]]

[initial]
state      = [0.1, 0.0]
covariance = [[0.1, 0], [0, 0.1]]
